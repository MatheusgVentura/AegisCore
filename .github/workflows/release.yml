name: Build and Release AegisCore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller --name "AegisCore" --noconsole --icon "aegiscore.ico" --add-data "ui;ui" --add-data "aegiscore.ico;." --clean --noconfirm app.py

      - name: Create Portable Zip
        run: |
          powershell Compress-Archive -Path "dist/AegisCore/*" -DestinationPath "dist/AegisCore-Portable-Windows.zip" -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AegisCore-Portable-Windows.zip
            dist/AegisCore-v*-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
