name: Security and Code Integrity Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit flake8

      - name: Python Syntax & Lint Verification
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Bandit Security Linter (SAST)
        run: |
          bandit -r app.py vault_core.py -ll
